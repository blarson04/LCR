# Baseline theme; values MUST mirror theme/tokens.json (light palette) — the
# smoke test asserts they match. ui/theme.py CSS refines it at runtime.
[theme]
base = "light"
primaryColor = "#1F5C43"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2E22"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
